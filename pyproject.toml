[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grads-svgopt"
version = "0.2.0"
description = "Combine adjacent same-color GrADS SVG paths, then optimize with SVGO"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
svgopt = "svgopt:main"

[tool.setuptools]
py-modules = ["svgopt"]
